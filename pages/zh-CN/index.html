<div class="desc">
	<p><strong>sekai引擎</strong>是专注于文字冒险类游戏创作的极简引擎。</p>
	<p>轻量、无依赖，使用自研<strong>解释器</strong>与极简<strong>编辑器</strong>——可快速构建视觉小说、互动叙事或ADV游戏，适合立开发者、作者或视觉小说爱好者快速开发游戏。</p>
	<p>内核基于<strong>Godot引擎</strong>开发，大型团队可嵌入Godot开发，实现3D场景、物理引擎等更多功能，实现从视觉小说到开放互动的无缝升级。</p>
